name: build
run-name: ${{ github.actor }} is testing barkeep
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '16 7 * * 1'
      timezone: America/New_York
jobs:
  build-and-test-for-cpp-meson:
    name: "Build and test for C++ with ${{ matrix.compiler }}"
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC 13
            os: ubuntu-24.04
            cxx: g++-13
            buildtype: debug
            coverage: true
          - compiler: GCC 14
            os: ubuntu-24.04
            cxx: g++-14
            buildtype: release
            coverage: false
          - compiler: GCC 15
            os: ubuntu-26.04
            cxx: g++-15
            buildtype: release
            coverage: false
          - compiler: Clang 18
            os: macos-15
            cxx: clang++
            buildtype: debug
            coverage: false
          - compiler: Clang 22
            os: ubuntu-26.04
            cxx: clang++-22
            buildtype: debug
            coverage: false
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: "Install tooling"
        run: python -m pip install meson ninja
      - name: "Install coverage tooling"
        if: matrix.coverage
        run: |
          sudo apt-get install lcov
          gcov-13 --version
          lcov --version
      - name: "Configure"
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export CXX="$(brew --prefix llvm@18)/bin/clang++"
          fi
          "$CXX" --version
          meson setup build --buildtype=${{ matrix.buildtype }} --warnlevel=3 --werror \
            -Db_coverage=${{ matrix.coverage }} -Db_ndebug=if-release
      - name: "Build and test"
        run: |
          meson compile -C build tests
          meson test -C build --no-rebuild --print-errorlogs \
            test.out test-fmtlib.out test-stdfmt.out
      - name: "Generate coverage"
        if: matrix.coverage
        run: |
          lcov -c -d build -o cov.info --gcov-tool gcov-13 --ignore-errors mismatch
          lcov --gcov-tool gcov-13 \
               --remove cov.info \
                                 '/usr/include*' \
                                 '*/subprojects/*' \
                                 '*/tests/*' \
               -o barkeep.info
          rm cov.info
      - name: Coveralls
        if: matrix.coverage
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: barkeep.info
  build-and-test-for-cpp-msvc:
    name: "Build and test for C++ with ${{ matrix.compiler }}"
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: MSVC
            os: windows-2022
            vs_version: '[17.0,18.0)'
          - compiler: MSVC (VS 2026)
            os: windows-2025-vs2026
            vs_version: '[18.0,19.0)'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: "Install tooling"
        run: python -m pip install meson ninja
      - name: "Build and test"
        shell: cmd
        run: |
          set "BARKEEP_VS_PATH="
          set "PATH=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer;%PATH%"
          for /f "usebackq delims=" %%i in (`vswhere -latest -version "${{ matrix.vs_version }}" -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "BARKEEP_VS_PATH=%%i"
          if not defined BARKEEP_VS_PATH (
            echo Requested Visual Studio C++ tools were not found.
            exit /b 1
          )
          call "%BARKEEP_VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /EHsc /permissive- /utf-8 ^
          /W4 /WX /I. test_package/test_package.cpp /Fe:test_package.exe
          if errorlevel 1 exit /b 1
          .\test_package.exe
          if errorlevel 1 exit /b 1
          rem Make Git's grep available while keeping MSVC's link.exe first.
          set "PATH=%PATH%;%ProgramFiles%\Git\usr\bin"
          set "CXX=cl"
          meson setup build --buildtype=debug --warnlevel=3 --werror ^
            "-Dcpp_args=['/utf-8', '/permissive-']"
          if errorlevel 1 exit /b 1
          meson compile -C build tests
          if errorlevel 1 exit /b 1
          meson test -C build --no-rebuild --print-errorlogs ^
            test.out test-fmtlib.out test-stdfmt.out
  build-and-test-for-cpp-sanitizers:
    name: "Build and test for C++ with ASan and UBSan"
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      CXX: clang++-18
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: "Install tooling"
        run: python -m pip install meson ninja
      - name: "Configure"
        run: |
          "$CXX" --version
          meson setup build --buildtype=debug --warnlevel=3 --werror \
            -Db_sanitize=address,undefined -Db_lundef=false
      - name: "Build and test"
        run: |
          meson compile -C build tests
          meson test -C build --no-rebuild --print-errorlogs \
            test.out test-fmtlib.out test-stdfmt.out
  build-and-test-for-python:
    name: "Build and test for Python"
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install meson pytest
          sudo apt install ninja-build
          meson setup build --buildtype=release --warnlevel=3
          meson compile -C build python
          PYTHONPATH=build/python pytest python/tests/test.py
  conan-recipe-test:
    name: "Test conan recipe"
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "Install tooling"
        run: |
          pip install "conan>=2.0"
          conan profile detect
      - name: "Build and test conan package"
        run: |
          conan create . --build=missing -s compiler.cppstd=20
  clang-format-check:
    name: "Check formatting"
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "Install clang-format"
        run: pip install -r requirements-dev.txt
      - name: "Check formatting"
        run: |
          clang-format --version
          clang-format --dry-run --Werror \
            barkeep/barkeep.h \
            docs/after.cpp docs/before.cpp \
            python/barkeep.cpp \
            test_package/test_package.cpp \
            tests/demo-fmtlib.cpp tests/demo-stdfmt.cpp tests/demo.cpp \
            tests/test-api-compatibility.cpp \
            tests/test-fmtlib.cpp tests/test-stdfmt.cpp tests/test.cpp \
            tests/testutil.h
